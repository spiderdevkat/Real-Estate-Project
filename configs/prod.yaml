project:
  name: realestate-tracker
  environment: prod
  region: ap-south-1

scraper:
  cities:
    - name: gurugram
      state: haryana
    - name: delhi-ncr
      state: delhi
    - name: bengaluru
      state: karnataka
    - name: mumbai
      state: maharashtra
    - name: pune
      state: maharashtra
    - name: hyderabad
      state: telangana
  delay_seconds: 3
  rotate_user_agents: true

pipeline:
  schedule: "0 6 * * *"
  batch_size: 5000